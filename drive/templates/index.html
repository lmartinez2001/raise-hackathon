<!DOCTYPE html>
<html>

<head>
    <title>Google Drive Viewer</title>
</head>

<body>
    {% if is_connected %}
    <h1>Welcome, {{ given_name }}!</h1>
    <button onclick="listFolders()">List Folders</button>
    <button onclick="listFiles()">List Files</button>
    <div id="folder-list"></div>
    <div id="file-list"></div>
    {% else %}
    <h2>Connect your Google account</h2>
    <a href="/auth/login"><button>Login with Google</button></a>
    {% endif %}


    <script>
        async function listFolders() {
            const response = await fetch("/drive/folders");
            if (response.status === 401) {
                alert("Session expired. Please log in again.");
                window.location.href = "/auth/login";
                return;
            }
            const data = await response.json();
            const list = document.getElementById("folder-list");
            list.innerHTML = "";
            (data.files || []).forEach(folder => {
                const li = document.createElement("li");
                li.textContent = folder.name + " (ID: " + folder.id + ")" +
                    (folder.driveId ? " [Drive ID: " + folder.driveId + "]" : "") +
                    (folder.parents ? " [Parent ID: " + folder.parents.join(", ") + "]" : "");
                list.appendChild(li);
            });
        }

        async function listFiles() {
            const response = await fetch("/drive/files");
            if (response.status === 401) {
                alert("Session expired. Please log in again.");
                window.location.href = "/auth/login";
                return;
            }
            const data = await response.json();
            const list = document.getElementById("file-list");
            list.innerHTML = "";
            console.log(data);

            // (data.files || []).forEach(folder => {
            //     const li = document.createElement("li");
            //     li.textContent = folder.name + " (ID: " + folder.id + ")" +
            //         (folder.driveId ? " [Drive ID: " + folder.driveId + "]" : "") +
            //         (folder.parents ? " [Parent ID: " + folder.parents.join(", ") + "]" : "");
            //     list.appendChild(li);
            // });
        }

    </script>
</body>

</html>
